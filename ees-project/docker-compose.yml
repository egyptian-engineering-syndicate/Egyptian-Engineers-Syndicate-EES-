services:
  database:
    image: postgres:16
    container_name: ees-directus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_password
      POSTGRES_DB: directus
    volumes:
      - ees_directus_database:/var/lib/postgresql/data

  directus:
    image: directus/directus:latest
    container_name: ees-directus
    restart: unless-stopped
    ports:
      - "8056:8055"
    depends_on:
      - database
    environment:
      SECRET: ees-directus-local-secret-change-this

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus_password

      ADMIN_EMAIL: admin@ees.local
      ADMIN_PASSWORD: EesAdmin@123456

      PUBLIC_URL: http://localhost:8056

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads

    volumes:
      - ees_directus_uploads:/directus/uploads

volumes:
  ees_directus_database:
  ees_directus_uploads: